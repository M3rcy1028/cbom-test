sonar.projectKey=cbom-lab
sonar.projectName=CBOM Lab
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=java-app/src/main/java,python-app,go-app
sonar.exclusions=**/target/**,**/__pycache__/**,**/*.pem
sonar.java.binaries=java-app/target/classes

# Sonar Cryptography Plugin output basename. The plugin appends .json.
sonar.cryptoScanner.cbom=results/sonar/cbom
